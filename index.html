<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>GitHub File Explorer</title>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial;
    padding:20px;
}

a{
    color:#4da6ff;
    text-decoration:none;
}

.file{
    margin:5px 0;
}
</style>
</head>
<body>

<h1>📂 Файлы репозитория</h1>

<div id="files">Загрузка...</div>

<script>
async function loadConfig() {

    const res = await fetch("config.json");

    return await res.json();
}

async function getRepoFiles() {

    const config = await loadConfig();

    const user = config.GITHUB_USER;
    const repo = config.GITHUB_REPO;
    const branch = config.GITHUB_BRANCH || "main";

    const filesDiv = document.getElementById("files");

    try {

        const response = await fetch(
            `https://api.github.com/repos/${user}/${repo}/git/trees/${branch}?recursive=1`
        );

        const data = await response.json();

        filesDiv.innerHTML = "";

        if(!data.tree) {
            filesDiv.innerHTML = "❌ Репозиторий не найден";
            return;
        }

        data.tree.forEach(item => {

            if(item.type === "blob") {

                const div = document.createElement("div");

                div.className = "file";

                div.innerHTML = `
                    📄 <a href="https://${user}.github.io/${repo}/${item.path}" target="_blank">
                        ${item.path}
                    </a>
                `;

                filesDiv.appendChild(div);
            }

        });

    } catch(err) {

        filesDiv.innerHTML = "❌ Ошибка";

        console.error(err);
    }
}

getRepoFiles();
</script>

</body>
</html>
