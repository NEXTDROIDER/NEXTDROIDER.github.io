<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub File Explorer</title>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    padding:20px;
}

h1{
    color:#00ff88;
}

a{
    color:#4da6ff;
    text-decoration:none;
}

a:hover{
    text-decoration:underline;
}

.file{
    margin:5px 0;
}
</style>
</head>
<body>

<h1>📂 Файлы репозитория</h1>

<div id="files">Загрузка...</div>

<script>

// ======================
// НАСТРОЙКИ
// ======================

const GITHUB_USER = "NEXTDROIDER";
const GITHUB_REPO = "NEXTDROIDER.github.io";
const GITHUB_BRANCH = "main";

// ======================

async function getRepoFiles() {

    const filesDiv = document.getElementById("files");

    try {

        const response = await fetch(
            `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/git/trees/${GITHUB_BRANCH}?recursive=1`
        );

        const data = await response.json();

        filesDiv.innerHTML = "";

        if(!data.tree) {
            filesDiv.innerHTML = "❌ Репозиторий не найден";
            return;
        }

        data.tree.forEach(item => {

            if(item.type === "blob") {

                const div = document.createElement("div");

                div.className = "file";

                const isUserSite =
                    GITHUB_REPO.toLowerCase() ===
                    `${GITHUB_USER.toLowerCase()}.github.io`;

                const fileUrl = isUserSite
                    ? `https://${GITHUB_USER}.github.io/${item.path}`
                    : `https://${GITHUB_USER}.github.io/${GITHUB_REPO}/${item.path}`;

                div.innerHTML = `
                    📄 <a href="${fileUrl}" target="_blank">
                        ${item.path}
                    </a>
                `;

                filesDiv.appendChild(div);
            }

        });

    } catch(err) {

        filesDiv.innerHTML = "❌ Ошибка загрузки файлов";

        console.error(err);
    }
}

getRepoFiles();

</script>

</body>
</html>
