<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Проводник папок</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #111;
        color: white;
        padding: 20px;
    }

    h1 {
        color: #00ff88;
    }

    ul {
        list-style: none;
        padding-left: 20px;
    }

    li {
        margin: 4px 0;
    }

    .folder {
        color: #4da6ff;
        cursor: pointer;
        user-select: none;
    }

    .file {
        color: #ddd;
    }

    .hidden {
        display: none;
    }
</style>
</head>
<body>

<h1>📁 Просмотр файлов и подпапок</h1>

<input type="file" id="folderInput" webkitdirectory multiple>

<div id="output"></div>

<script>
const input = document.getElementById("folderInput");
const output = document.getElementById("output");

input.addEventListener("change", (e) => {
    const files = [...e.target.files];

    const tree = {};

    files.forEach(file => {
        const parts = file.webkitRelativePath.split("/");

        let current = tree;

        parts.forEach((part, index) => {
            if (index === parts.length - 1) {
                current[part] = null;
            } else {
                current[part] = current[part] || {};
                current = current[part];
            }
        });
    });

    output.innerHTML = "";
    output.appendChild(renderTree(tree));
});

function renderTree(obj) {
    const ul = document.createElement("ul");

    for (const key in obj) {
        const li = document.createElement("li");

        if (obj[key] === null) {
            li.innerHTML = "📄 <span class='file'>" + key + "</span>";
        } else {
            const folderName = document.createElement("span");
            folderName.className = "folder";
            folderName.textContent = "📁 " + key;

            const childTree = renderTree(obj[key]);
            childTree.classList.add("hidden");

            folderName.onclick = () => {
                childTree.classList.toggle("hidden");
            };

            li.appendChild(folderName);
            li.appendChild(childTree);
        }

        ul.appendChild(li);
    }

    return ul;
}
</script>

</body>
</html>
