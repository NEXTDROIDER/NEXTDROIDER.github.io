<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub Apache Style Explorer</title>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    padding:20px;
}

h1{
    color:#00ff88;
}

a{
    color:#4da6ff;
    text-decoration:none;
}

a:hover{
    text-decoration:underline;
}

.item{
    margin:6px 0;
}

.folder a{
    color:#00ff88;
}

.path{
    margin-bottom:20px;
    color:#aaa;
}
</style>
</head>
<body>

<h1>📂 Index of /</h1>

<div class="path" id="path"></div>
<div id="files">Загрузка...</div>

<script>

// ======================
// НАСТРОЙКИ
// ======================

const GITHUB_USER = "NEXTDROIDER";
const GITHUB_REPO = "NEXTDROIDER.github.io";
const GITHUB_BRANCH = "main";

// ======================

let allFiles = [];

async function loadRepo() {

    const res = await fetch(
        `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/git/trees/${GITHUB_BRANCH}?recursive=1`
    );

    const data = await res.json();

    allFiles = data.tree;

    render();
}

function getCurrentPath() {

    return decodeURIComponent(
        location.hash.replace(/^#/, "")
    );
}

function render() {

    const currentPath = getCurrentPath();

    document.getElementById("path").innerHTML =
        `Текущая папка: /${currentPath}`;

    const filesDiv = document.getElementById("files");

    filesDiv.innerHTML = "";

    const folders = new Set();
    const files = [];

    allFiles.forEach(item => {

        if(item.path.startsWith(currentPath)) {

            const rest = item.path.slice(currentPath.length);

            const clean = rest.replace(/^\/+/, "");

            if(!clean) return;

            const parts = clean.split("/");

            const name = parts[0];

            // Скрываем .файлы, .папки и index.html
             if(
             name.startsWith(".") ||
             name.toLowerCase() === "index.html"
             ) return;

            if(parts.length > 1) {

                folders.add(name);

            } else {

                if(item.type === "blob") {
                    files.push(name);
                }
            }
        }
    });

    // Назад
    if(currentPath) {

        const up = document.createElement("div");

        up.className = "item folder";

        const parent =
            currentPath.split("/").slice(0, -1).join("/");

        up.innerHTML = `
            📁 <a href="#${parent}">
                ..
            </a>
        `;

        filesDiv.appendChild(up);
    }

    // Папки
    [...folders].sort().forEach(folder => {

        const div = document.createElement("div");

        div.className = "item folder";

        const nextPath =
            currentPath
            ? currentPath + "/" + folder
            : folder;

        div.innerHTML = `
            📁 <a href="#${nextPath}">
                ${folder}/
            </a>
        `;

        filesDiv.appendChild(div);
    });

    // Файлы
    files.sort().forEach(file => {

        const div = document.createElement("div");

        div.className = "item";

        const fullPath =
            currentPath
            ? currentPath + "/" + file
            : file;

        const isUserSite =
            GITHUB_REPO.toLowerCase() ===
            `${GITHUB_USER.toLowerCase()}.github.io`;

        const fileUrl = isUserSite
            ? `https://${GITHUB_USER}.github.io/${fullPath}`
            : `https://${GITHUB_USER}.github.io/${GITHUB_REPO}/${fullPath}`;

        div.innerHTML = `
            📄 <a href="${fileUrl}" target="_blank">
                ${file}
            </a>
        `;

        filesDiv.appendChild(div);
    });
}

window.addEventListener("hashchange", render);

loadRepo();

</script>

</body>
</html>
